<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">SmartRule Conflict Analyzer</title><desc id="desc">Repository card showing rule dependencies and one detected action conflict.</desc>
  <rect width="1200" height="630" fill="#F4F0E7"/><text x="82" y="142" fill="#9C3F35" font-family="Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="3">RULE RELATIONSHIP RESEARCH</text><text x="82" y="218" fill="#1B252E" font-family="Arial,sans-serif" font-size="56" font-weight="700">SmartRule Conflict Analyzer</text><text x="84" y="263" fill="#53616B" font-family="Arial,sans-serif" font-size="24">Conflict cases, dependency DAGs, and reproducible Apriori evidence.</text>
  <g stroke-width="4" fill="#FFFDF8"><path d="M234 416 H450" stroke="#657B83"/><path d="M560 416 H770" stroke="#9C3F35" stroke-dasharray="12 10"/><path d="M880 416 H1045" stroke="#657B83"/><circle cx="180" cy="416" r="54" stroke="#657B83"/><circle cx="505" cy="416" r="54" stroke="#657B83"/><circle cx="825" cy="416" r="54" stroke="#9C3F35"/><circle cx="1060" cy="416" r="54" stroke="#657B83"/></g><g font-family="Arial,sans-serif" text-anchor="middle"><text x="180" y="411" fill="#1B252E" font-size="18">trigger</text><text x="180" y="435" fill="#53616B" font-size="15">motion</text><text x="505" y="411" fill="#1B252E" font-size="18">rule A</text><text x="505" y="435" fill="#53616B" font-size="15">light = on</text><text x="825" y="411" fill="#9C3F35" font-size="18">conflict</text><text x="825" y="435" fill="#9C3F35" font-size="15">light = off</text><text x="1060" y="411" fill="#1B252E" font-size="18">report</text><text x="1060" y="435" fill="#53616B" font-size="15">DAG + reason</text></g>
